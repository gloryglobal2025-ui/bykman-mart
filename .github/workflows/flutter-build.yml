name: Build Flutter APK and Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: bykman-mart-web
          path: build/web
          if-no-files-found: error
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Gradle wrapper
        run: |
          mkdir -p .gradle-wrapper
          gradle wrapper --gradle-version 8.14.3 --distribution-type all -p .gradle-wrapper
          cp .gradle-wrapper/gradlew .gradle-wrapper/gradlew.bat android/
          cp .gradle-wrapper/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/
          chmod +x android/gradlew
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: bykman-mart-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
